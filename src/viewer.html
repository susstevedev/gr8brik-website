<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/"
      }
    }
    </script>

    <style>
        body {
            font-family: Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            color: #fafafa;
            background-color: #d3d3d3;
        }

        #image {
            display: block;
            height: 180px;
            width: 50%;
            top: 25%;
            left: 25%;
            position: fixed;
        }

        .box {
            position: absolute;
            background-color: rgba(36, 36, 36, 0.8);
            color: #fff;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 0px;
            box-shadow: rgba(30, 30, 30, 0.06) 0px 0px 4px 4px;
        }

        .box-load {
            position: absolute;
            background-color: #ddd;
            color: #000;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 4px;
            border: 1px #fafafa solid;
        }

        #watermark {
            position: absolute;
            display: none;
            background-color: rgba(36, 36, 36, 0.8);
            color: #fff;
            bottom: 0px;
            right: 0px;
            padding: 6px 16px;
        }

        #watermark img {
            width: 20px;
            height: 20px;
            border-radius: 15px;
            border: 1px solid #000;
            filter: invert(100%);
        }

        #loading {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
        }

        #stats {
            top: 0;
            left: 0;
            display: none;
        }

        #username {
            top: 50px;
        }

        #date-v2 {
            top: 100px;
        }

        #username,
        #date-v2 {
            left: 0;
            display: none;
            font-size: 15px;
            padding: 5px 15px;
        }

        #username img {
            width: 20px;
            height: 20px;
            border-radius: 6px;
        }

        button {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.2s ease-in-out;
            background-color: #87ceeb;
            padding: 6px 16px;
            text-align: center;
            border: 1px #ddd solid;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #retry {
            display: none;
        }

        #viewer {
            background-color: #333;
        }

        a {
            color: #fff;
        }

        a:visited:hover {
            color: #fff;
        }

        a:visited {
            color: #fff;
        }

        a:hover {
            color: #fff;
        }

        #web-settings {
            top: 0px;
            right: 0px;
            border-radius: 3px;
            display: none;
        }

        #web-settings:hover {
            background-color: #87ceeb;
            color: #000;
            cursor: pointer;
        }

        #web-settings-dropdown {
            display: none;
            right: 0px;
            top: 50px;
            border-radius: 3px;
        }

        #web-settings-dropdown div {
            position: relative;
            border-radius: 3px;
            padding: 2px 2px 2px 2px;
        }

        #web-settings-dropdown div:hover {
            background-color: #87ceeb;
            color: #000;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <script type="module" src="/lib/viewer.js"></script>

    <img id="image" />
    <div id="loading" class="box-load">...</div>
    <button id="retry">Retry</button>
    <div id="stats" class="box"></div>
    <div id="username" class="box">By </div>
    <div id="date-v2" class="box">Created </div>
    <div id="web-settings" class="box right">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sliders2"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M10.5 1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4H1.5a.5.5 0 0 1 0-1H10V1.5a.5.5 0 0 1 .5-.5M12 3.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m-6.5 2A.5.5 0 0 1 6 6v1.5h8.5a.5.5 0 0 1 0 1H6V10a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5M1 8a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 1 8m9.5 2a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V13H1.5a.5.5 0 0 1 0-1H10v-1.5a.5.5 0 0 1 .5-.5m1.5 2.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5" />
        </svg>
    </div>
    <div id="web-settings-dropdown" class="box">
        <div>
            <span id="show-lines">Enable/disable lines</span>
        </div>
    </div>
    <div id="watermark"></div>
    <canvas id="viewer" style="width: 100vw; height: 100vh; display: none;"></canvas>
</body>

</html>
