<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Offline</title>
    <link rel="stylesheet" href="/lib/w3_new.css">
    <link rel="stylesheet" href="/lib/theme.css">
    <link rel="apple-touch-icon" href="/img/logo.jpg" />
    <meta name="apple-mobile-web-app-status-bar" content="#f1f1f1" />
    <meta name="theme-color" content="#f1f1f1" />
</head>
<body class="w3-container w3-center w3-light-grey">
    <h4>Offline</h4>
    <p>You're offline. Try reloading.</p>
    <button id="rld" class="w3-button w3-blue w3-hover-shadow w3-padding-small w3-round w3-border w3-border-indigo">Reload</button>

    <script>
        document.getElementById('rld').addEventListener('click', function(e) {
            window.location.reload();
        });
    </script>
</body>
</html>
