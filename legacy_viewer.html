<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/three@0.89.0/build/three.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.89.0/examples/js/loaders/RGBELoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.89.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            font-family: Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            color: #fafafa;
            background-color: #d3d3d3;
        }

        .box {
            position: absolute;
            background-color: rgba(36, 36, 36, 0.8);
            color: #fff;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 0px;
            box-shadow: rgba(30, 30, 30, 0.06) 0px 0px 4px 4px;
        }

        .box-load {
            position: absolute;
            background-color: #ddd;
            color: #000;
            padding: 10px 20px;
            font-size: 20px;
            border-radius: 4px;
        }

        #watermark {
            position: absolute;
            display: none;
            background-color: rgba(36, 36, 36, 0.8);
            color: #fff;
            bottom: 0px;
            right: 0px;
            padding: 6px 16px;
        }

        #watermark img {
            width: 20px;
            height: 20px;
            border-radius: 15px;
            border: 1px solid #000;
            filter: invert(100%);
        }

        #loading {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
        }

        #stats {
            top: 0;
            left: 0;
            display: none;
        }

        #username {
            top: 50px;
        }

        #date-v2 {
            top: 100px;
        }

        #username,
        #date-v2 {
            left: 0;
            display: none;
            font-size: 15px;
            padding: 5px 15px;
        }

        #username img {
            width: 20px;
            height: 20px;
            border-radius: 6px;
        }

        button {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.2s ease-in-out;
            background-color: #87ceeb;
            padding: 6px 16px;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        #retry {
            display: none;
        }

        #viewer {
            background-color: #333;
        }

        a {
            color: #fff;
        }

        a:visited:hover {
            color: #fff;
        }

        a:visited {
            color: #fff;
        }

        a:hover {
            color: #fff;
        }

        #web-settings {
            top: 0px;
            right: 0px;
        }

        #web-settings-dropdown {
            display: none;
            right: 0px;
            top: 50px;
        }

        #web-settings-dropdown span {
            position: relative;
            text-transform: uppercase;
        }

        #web-settings-dropdown span:hover {
            background-color: #87ceeb;
            color: #000;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById('retry').onclick = function () {
                window.location.reload();
            }

            const version_string = "Gr8brik Legacy Viewer";
            let debug = false;

            const viewer = document.getElementById("viewer");
            const loading = document.getElementById("loading");
            const wmark = document.getElementById("watermark");

            const model_file = new URLSearchParams(window.location.search).get("model");

            const stat_date = document.getElementById("date-v2");
            const stat_username = document.getElementById("username");
            const stat_name = document.getElementById("stats");

            if (!model_file) {
                console.error("invalid creation file");
                loading.innerText = "Creation not found";
                return;
            }

            fetch(`/ajax/build?buildId=${model_file}&fetch=1`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Server returned the error code ${response.status}`);
                        console.error(response);
                    }
                    return response.text();
                })
                .then(text => {
                    try {
                        window.creation_data = text;
                        return JSON.parse(creation_data);
                    } catch (error) {
                        console.error(response);
                    }
                })
                .then(creation_data => {
                    fetch(`${creation_data.model}`)
                        .then(response => {
                            if (!response.ok) {
                                console.error(response);
                            }
                            return response.text();
                        })
                        .then(text => {
                            try {
                                const model_data = JSON.parse(text);
                                load_model_data(model_data);
                            } catch (error) {
                                alert(error);
                                console.error(error);
                            }
                        })
                })

                .catch(error => {
                    console.error(error);
                    loading.innerText = `An error occurred: ${error.message}`;
                    document.getElementById("retry").style.display = "block";
                });

            function load_model_data(model_data) {
                var scene = new THREE.Scene();

                var renderer = new THREE.WebGLRenderer({ canvas: viewer, antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);

                var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);

                if (model_data.camera) {
                    camera.position.set(model_data.camera.x, model_data.camera.y, model_data.camera.z);
                } else {
                    camera.position.set(250, 250, 250);
                }

                var ambient = new THREE.AmbientLight(0xffffff);
                scene.add(ambient);

                var directional = new THREE.DirectionalLight(0xffffff, 2.5);
                directional.position.set(camera.position.x, camera.position.y, camera.position.z);
                scene.add(directional);

                var directional2 = new THREE.DirectionalLight(0xffffff, 2.5);
                directional2.position.set(camera.position.x - camera.position.x * 2, camera.position.y - camera.position.y * 2, camera.position.z - camera.position.z * 2);
                scene.add(directional2);

                if (debug === true) {
                    console.log(camera.position.x - camera.position.x * 2, camera.position.y - camera.position.y * 2, camera.position.z - camera.position.z * 2);
                    console.log(camera.position.x, camera.position.y, camera.position.z);
                }

                var controls = new THREE.OrbitControls(camera, renderer.domElement);
                var rgbe_loader = new THREE.RGBELoader();

                rgbe_loader.load('https://cdn.jsdelivr.net/gh/susstevedev/gr8brik/lib/autumn_field_puresky_1k.hdr', function (texture) {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    scene.environment = texture;
                });

                var loader = new THREE.ObjectLoader();
                var loadedCount = 0;

                /*model_data.forEach((obj, i) => {
                    var obji = obj.intersect.object;
                    
                    loader.parse(obji, function (o) {
                        scene.add(o);
                        console.log("Loaded object: ", o);
                        
                        loadedCount++;

                        if (loadedCount === model_data.length) {
                            showViewer();
                        }
                    });
                });*/

                function repair(raw) {
                    let fixed = raw;
                    
                    fixed = fixed.replace(/],{"version":4.5/g, '],"object":{"version":4.5');
                    fixed = fixed.replace(/,[-0-9.]*$/, ''); 
                    
                    if ((fixed.match(/\[/g) || []).length > (fixed.match(/\]/g) || []).length) {
                        fixed += ']';
                    }

                    if ((fixed.match(/\{/g) || []).length > (fixed.match(/\}/g) || []).length) {
                        fixed += '}';
                    }
                    
                    while (fixed.endsWith('}') && !fixed.endsWith('}]')) {
                        fixed += ']';
                    }
                    
                    console.log(fixed);
                    return JSON.parse(fixed);
                }

                function loadLegacyModel(model_data) {
                    var loader = new THREE.ObjectLoader();
                    let loadedCount = 0;

                    model_data.forEach((obj, i) => {
                        let obji = obj.intersect.object;
                        
                        let geoArray = obji.geometries;
                        let matArray = obji.materials;
                        
                        let geoUuid = (Array.isArray(geoArray) && geoArray[0]) ? geoArray[0].uuid : (geoArray ? geoArray.uuid : null);
                        let matUuid = (Array.isArray(matArray) && matArray[0]) ? matArray[0].uuid : (matArray ? matArray.uuid : null);

                        if (geoArray && !Array.isArray(geoArray)) obji.geometries = [geoArray];
                        if (matArray && !Array.isArray(matArray)) obji.materials = [matArray];

                        if (!obji.object) {
                            obji.object = {
                                "uuid": THREE.Math.generateUUID ? THREE.Math.generateUUID() : THREE.MathUtils.generateUUID(),
                                "type": "Mesh",
                                "geometry": geoUuid,
                                "material": matUuid
                            };
                        }

                        loader.parse(obji, function (mesh) {
                            if (obj.translation && obj.translation.length === 3) {
                                mesh.position.set(obj.translation[0], obj.translation[1], obj.translation[2]);
                            }

                            if (obj.rotation) {
                                if (Array.isArray(obj.rotation)) {
                                    mesh.rotation.fromArray(obj.rotation);
                                } else if (obj.rotation._x !== undefined) {
                                    mesh.rotation.set(obj.rotation._x, obj.rotation._y, obj.rotation._z);
                                }
                            }

                            mesh.userData.makeLine = true;
                            if(mesh.geometry.type == "PlaneBufferGeometry") {
                                mesh.visible = false;
                                mesh.userData.makeLine = false;
                            }

                            if(mesh.material.type == "ShadowMaterial") {
                                mesh.visible = false;
                                mesh.userData.makeLine = false;
                            }

                            if(mesh.userData.makeLine) {
                                var edges = new THREE.EdgesGeometry(mesh.geometry);
                                var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
                                mesh.add(line);
                            }

                            scene.add(mesh);
                            console.log("restored" + mesh);
                            
                            loadedCount++;
                            if (loadedCount === model_data.length) {
                                showViewer();
                            }
                        });
                    });
                }

                loadLegacyModel(repair(JSON.stringify(model_data)));

                function showViewer() {
                    document.title = `${JSON.parse(window.creation_data).name} | gr8brik.rf.gd`;

                    loading.style.display = "none";
                    viewer.style.display = "block";

                    wmark.style.display = "block";
                    wmark.innerHTML = "<img src='/img/logo/simplev2.png' alt='Logo' title='Logo' /> gr8brik.rf.gd";

                    stat_name.style.display = "block";
                    stat_name.innerHTML += `<a href="/build/${JSON.parse(window.creation_data).modelid}" target="_blank">${JSON.parse(window.creation_data).name}</a>`;

                    stat_username.style.display = "block";
                    stat_username.innerHTML += `<a href="/user/${JSON.parse(window.creation_data).userid}" target="_blank"><img src='/acc/users/pfps/${JSON.parse(window.creation_data).userid}.webp' alt='User icon' title='User icon' />${JSON.parse(window.creation_data).username}</a>`;

                    stat_date.style.display = "block";
                    stat_date.innerHTML += `${JSON.parse(window.creation_data).date}`;

                    animate();
                }

                window.showViewer = showViewer;

                window.addEventListener('resize', onWinResize, true);

                function onWinResize() {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }

                function animate() {
                    requestAnimationFrame(animate);

                    if (controls) {
                        controls.update();
                    }

                    renderer.render(scene, camera);
                }
                animate();
            }
        });
    </script>
    <div id="loading" class="box-load">Loading...</div>
    <button id="retry">Retry</button>
    <div id="stats" class="box"></div>
    <div id="username" class="box">By </div>
    <div id="date-v2" class="box">Created </div>
    <div id="web-settings" class="box right">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sliders2"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M10.5 1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4H1.5a.5.5 0 0 1 0-1H10V1.5a.5.5 0 0 1 .5-.5M12 3.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m-6.5 2A.5.5 0 0 1 6 6v1.5h8.5a.5.5 0 0 1 0 1H6V10a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5M1 8a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 1 8m9.5 2a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V13H1.5a.5.5 0 0 1 0-1H10v-1.5a.5.5 0 0 1 .5-.5m1.5 2.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5" />
        </svg>
    </div>
    <div id="web-settings-dropdown" class="box">
        <span id="show-lines">enable/disable lines</span>
    </div>
    <div id="watermark"></div>
    <canvas id="viewer" style="width: 100vw; height: 100vh; display: none;"></canvas>
</body>

</html>
